[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "motherbrain"
version = "0.1.0"
description = "A personal large language model, built from scratch in PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Cetta" }]
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
motherbrain = "motherbrain.cli:main"

[tool.setuptools.packages.find]
include = ["motherbrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
