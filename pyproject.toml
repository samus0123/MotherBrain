[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motherbrain"
version = "0.1.0"
description = "A trainable, versioned, IDE-accessible language model."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

# This is what makes `mb` a real command instead of a README fiction.
[project.scripts]
mb = "motherbrain.cli:main"

[tool.setuptools]
packages = ["motherbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
