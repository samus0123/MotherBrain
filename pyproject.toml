[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motherbrain"
version = "0.1.0"
description = "A from-scratch decoder-only language model with a serious training stack."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tokenizer = ["tokenizers>=0.15"]
data = ["datasets>=2.16", "tqdm>=4.66"]
logging = ["wandb>=0.16", "tensorboard>=2.15"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
motherbrain-train = "motherbrain.train:main"
motherbrain-sample = "motherbrain.sample:main"
motherbrain-eval = "motherbrain.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/motherbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
