# Tiny end-to-end run for smoke tests: seconds on CPU, no compile.
inherit: base.yaml

model:
  vocab_size: 512
  n_layer: 2
  n_head: 4
  n_kv_head: 2
  d_model: 128
  max_seq_len: 128

optim:
  lr: 1.0e-3
  warmup_steps: 10

train:
  out_dir: runs/debug
  batch_size: 4
  grad_accum_steps: 2
  max_steps: 50
  device: cpu
  dtype: float32
  compile: false
  eval_interval: 25
  eval_steps: 5
  log_interval: 10
  ckpt_interval: 25
